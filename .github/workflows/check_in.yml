name: 图书馆签到

on:
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:

jobs:
  check_in:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml python-telegram-bot pycryptodome beautifulsoup4 cryptography

      - name: 运行签到脚本
        run: |
          python py/check_in.py -c config_studentA.yml
          python py/check_in.py -c config_studentB.yml
