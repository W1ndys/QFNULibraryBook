name: 图书馆签到

on:
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:

jobs:
  check_in:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml cryptography python-telegram-bot

        run: |
          cat > py/config.yml << 'EOF'
          USERNAME: "${{ secrets.USERNAME }}"
          PASSWORD: "${{ secrets.PASSWORD }}"
          PUSH_METHOD: "${{ secrets.PUSH_METHOD }}"
          DD_BOT_TOKEN: "${{ secrets.DD_BOT_TOKEN }}"
          DD_BOT_SECRET: "${{ secrets.DD_BOT_SECRET }}"
          TELEGRAM_BOT_TOKEN: "${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHANNEL_ID: "${{ secrets.CHANNEL_ID }}"
          BARK_URL: "${{ secrets.BARK_URL }}"
          BARK_EXTRA: "${{ secrets.BARK_EXTRA }}"
          ANPUSH_TOKEN: "${{ secrets.ANPUSH_TOKEN }}"
          ANPUSH_CHANNEL: "${{ secrets.ANPUSH_CHANNEL }}"
          GITHUB: "true"
          EOF

      - name: 运行签到脚本
        run: python py/check_in.py