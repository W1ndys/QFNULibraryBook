name: 图书馆座位预约

on:
  schedule:
    - cron: '17 11 * * *'  # 北京时间 19:17 = UTC 11:17
  workflow_dispatch:

jobs:
  get-seat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          
      - name: 运行座位预约
        env:
          TZ: Asia/Shanghai
        run: |
          cd zxy/py
          python get_seat.py