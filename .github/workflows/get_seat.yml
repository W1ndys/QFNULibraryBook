name: 图书馆座位预约

on:
  schedule:
    - cron: '15 11 * * *'
  workflow_dispatch:

jobs:
  get_seat:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml pycryptodome python-telegram-bot beautifulsoup4

      - name: 运行预约脚本
        run: python py/get_seat.py