name: 图书馆早上签到

on:
  schedule:
    - cron: '20 0 * * *'  # 北京时间 8:20 = UTC 0:20
  workflow_dispatch:

jobs:
  sign-out-morning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          
      - name: 运行早上签退
        env:
          TZ: Asia/Shanghai
        run: |
          cd zxy/py
          python check_in.py