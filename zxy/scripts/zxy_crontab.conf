# 图书馆座位管理系统 - zxy 定时任务配置
# 安装方法: crontab zxy_crontab.conf

# 每天 19:17 运行 get_seat.py (预约座位)
17 19 * * * cd ./zxy/py && python3 get_seat.py >> /var/log/zxy_get_seat.log 2>&1

# 每天 21:29 运行 sign_out.py (晚上签退，重试2000次)
29 21 * * * cd ./zxy/py && python3 sign_out.py >> /var/log/zxy_sign_out_night.log 2>&1

# 每天 8:20 运行 sign_out.py (早上签退，重试2000次，已签到不算失败)
20 8 * * * cd ./zxy/py && python3 sign_out.py >> /var/log/zxy_sign_out_morning.log 2>&1
